<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EA">
<title>汉字拼音配对</title>
<style>
  :root{
    --bg:#F7F3EA; --panel:#FFFDF8; --line:#E7DFD2; --ink:#2C2A26; --muted:#8C8577;

    /* 朱砂 · 藤黄（词语） */
    --zhu:#C0392B; --zhu-soft:#FBEBE7; --zhu-line:#EFC9C1; --zhu-shadow:rgba(192,57,43,.20);
    --teng:#D8A11C; --teng-ink:#8A6A16;

    /* 松绿 · 墨（单字） */
    --green:#2E8B57; --green-soft:#F1F8F3; --green-line:#B7D8C2; --green-shadow:rgba(46,139,87,.20);
    --mo:#23262B; --mo-ink:#4A4F57;

    /* 天青 · 石青（地名） */
    --tian:#4A8FA8; --tian-soft:#E9F3F5; --tian-line:#C0DBE1; --tian-shadow:rgba(74,143,168,.22);
    --shiqing:#7FA9B5; --shiqing-ink:#4A6E78;

    --gold:#A97A1F;

    --accent:var(--green); --accent-soft:var(--green-soft);
    --accent-line:var(--green-line); --accent-shadow:var(--green-shadow);
    --accent2:var(--gold); --accent2-ink:#6F5417;
  }
  body[data-mode="all"], body[data-mode="w"]{
    --bg:#FBF3EC;
    --accent:var(--zhu); --accent-soft:var(--zhu-soft);
    --accent-line:var(--zhu-line); --accent-shadow:var(--zhu-shadow);
    --accent2:var(--teng); --accent2-ink:var(--teng-ink);
  }
  body[data-mode="s"]{
    --bg:#F7F3EA;
    --accent:var(--green); --accent-soft:var(--green-soft);
    --accent-line:var(--green-line); --accent-shadow:var(--green-shadow);
    --accent2:var(--mo); --accent2-ink:var(--mo-ink);
  }
  body[data-mode="p"]{
    --bg:#F2F7F8;
    --accent:var(--tian); --accent-soft:var(--tian-soft);
    --accent-line:var(--tian-line); --accent-shadow:var(--tian-shadow);
    --accent2:var(--shiqing); --accent2-ink:var(--shiqing-ink);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:radial-gradient(900px 500px at 50% -10%, #FFFDF7 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;
    padding:max(14px, env(safe-area-inset-top)) 12px max(22px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    transition:background .3s ease;
  }
  .wrap{ max-width:620px; margin:0 auto; }

  /* ---------- 头部 ---------- */
  header{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
  h1{
    font-family:"Songti SC","SimSun","STSong",serif;
    font-size:18px; margin:0; color:var(--accent); letter-spacing:.5px;
    flex:1 1 auto; min-width:0; transition:color .3s ease;
  }
  h1 span{ font-size:11px; color:var(--muted); font-weight:400; margin-left:6px; letter-spacing:.06em; }
  h1 b{ font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }

  .modes{ display:flex; gap:6px; flex:1 1 auto; flex-wrap:wrap; }
  .mode{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:inherit; transition:background .15s, color .15s, border-color .15s;
  }
  .mode:hover{ background:#F6F1E7; }
  .mode.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .cal-btn{
    width:32px; height:32px; flex:none;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--line); background:var(--panel); color:var(--accent);
    border-radius:9px; cursor:pointer; padding:0; font-family:inherit;
    box-shadow:0 2px 6px rgba(120,100,60,.06);
    transition:background .12s, border-color .12s, transform .12s;
  }
  .cal-btn:hover{ background:var(--accent-soft); border-color:var(--accent-line); }
  .cal-btn:active{ transform:scale(.96); }
  .cal-btn svg{
    width:18px; height:18px; display:block;
    fill:none; stroke:currentColor; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;
  }

  .stats{
    display:flex; flex-wrap:wrap; justify-content:space-between;
    gap:6px 14px; font-size:11.5px; color:var(--muted);
    flex:1 1 100%; max-width:100%;
  }
  .stats b{ color:var(--ink); font-size:14px; margin-left:4px; font-variant-numeric:tabular-nums; font-weight:700; }
  #score{ color:var(--accent); }
  #combo{ color:var(--gold); }

  .hint{
    font-size:12px; color:var(--muted); margin:4px 0 10px; min-height:18px; letter-spacing:.02em;
  }
  .hint b{ color:var(--accent); }
  .hint .warn{ color:var(--red); }
  .hint .gold{ color:var(--gold); }

  /* ---------- 棋盘 ---------- */
  .board{
    position:relative; display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:8px clamp(16px, 5vw, 30px); padding:4px 0;
  }
  #lines{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:5; }
  .col{ display:flex; flex-direction:column; gap:8px; min-width:0; }

  /* ---------- 卡片 ---------- */
  .tile{
    width:100%; min-height:46px; display:flex; align-items:center; gap:8px;
    padding:6px 10px; border-radius:12px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-left-width:3px;
    font-family:inherit; color:var(--ink); text-align:left; min-width:0;
    overflow-wrap:anywhere; position:relative;
    transition:transform .12s, box-shadow .12s, border-color .12s, background .12s, opacity .2s;
    box-shadow:0 2px 6px rgba(120,100,60,.05);
  }
  .tile:active{ transform:scale(.985); }

  .tile.zh{ border-left-color:var(--accent); }
  .tile.py{ border-left-color:var(--accent2); }

  .tile .word{ flex:1 1 auto; min-width:0; line-height:1.2; }
  .tile.zh .word{
    font-family:"Songti SC","SimSun","STSong",serif;
    font-size:clamp(16px,4.2vw,19px); font-weight:600; letter-spacing:.06em;
  }
  .tile.py .word{
    font-size:clamp(13px,3.6vw,15px); font-weight:500; letter-spacing:.02em; color:var(--accent2-ink);
  }

  .tag{
    flex:none; font-size:9px; font-weight:700; line-height:1.5; letter-spacing:.04em;
    padding:1px 5px; border-radius:999px; color:#fff; background:#C7A877;
  }
  .tag.p{ background:var(--tian); }
  .tag.s{ background:var(--green); }
  .tag.d{ background:#5B4A6B; }

  /* 状态 */
  .tile.sel{
    border-color:var(--accent); background:var(--accent-soft);
    box-shadow:0 0 0 3px var(--accent-shadow);
  }
  .tile.sel .word{ color:var(--accent); }

  .tile.ok{ border-color:var(--green); background:var(--green-soft); }
  .tile.ok .word{ color:var(--green); }

  .tile.bad{ animation:shake .35s; border-color:var(--red); background:#FDF1EF; }
  .tile.bad .word{ color:var(--red); }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-5px); }
    40%{ transform:translateX(5px); }
    60%{ transform:translateX(-3px); }
    80%{ transform:translateX(2px); }
  }

  /* 配对后留在原位，只变淡，避免整列跳动 */
  .tile.matched{
    background:#F2EFE8; border-color:#EAE4D8; border-left-color:#DCD5C7;
    box-shadow:none; pointer-events:none;
  }
  .tile.matched .word{ color:#D3CBBE; }
  .tile.matched .tag{ opacity:.35; }

  /* 连线 */
  .link-halo{
    fill:none; stroke:var(--accent); stroke-opacity:.18; stroke-width:11; stroke-linecap:round;
    stroke-dasharray:100; stroke-dashoffset:100;
    animation:drawLink .40s ease forwards, fadeOut .30s ease .46s forwards;
  }
  .link{
    fill:none; stroke:var(--accent); stroke-width:2.6; stroke-linecap:round;
    stroke-dasharray:100; stroke-dashoffset:100;
    animation:drawLink .40s ease forwards, fadeOut .30s ease .46s forwards;
  }
  .link-dot{
    fill:var(--accent); opacity:0;
    animation:dotIn .18s ease .08s forwards, fadeOut .30s ease .46s forwards;
  }
  @keyframes drawLink{ to{ stroke-dashoffset:0; } }
  @keyframes dotIn{ to{ opacity:1; } }
  @keyframes fadeOut{ to{ opacity:0; } }

  /* ---------- 信息面板 ---------- */
  .example{
    margin:12px 0 0; min-height:56px; padding:9px 12px;
    border-radius:12px; background:var(--accent-soft); border:1px solid var(--accent-line);
    display:flex; align-items:center; gap:10px;
    transition:background .3s ease, border-color .3s ease;
  }
  .example .ex-main{ flex:1 1 auto; min-width:0; }
  .example .ex-word{
    font-size:13px; font-weight:700; color:var(--accent); line-height:1.45;
    font-family:"Songti SC","SimSun","STSong",serif; letter-spacing:.04em;
  }
  .example .ex-word .py{
    font-family:"PingFang SC","Helvetica Neue",system-ui,sans-serif;
    font-size:12px; font-weight:500; color:#6B7C6F; margin-left:8px; letter-spacing:.02em;
  }
  .example .ex-word.empty{ font-family:inherit; font-size:12.5px; font-weight:500; color:#A39A8A; letter-spacing:.02em; }
  .example .ex-text{ font-size:11.5px; color:#6B6357; line-height:1.55; margin-top:2px; }
  .example .ex-text:empty{ display:none; }
  .example .ex-say{
    flex:none; border:1px solid var(--accent-line); background:#FFFDF8; color:var(--accent);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit;
    font-weight:600;
  }
  .example .ex-say:hover{ background:#F4EEDF; }

  /* ---------- 底部 ---------- */
  .bar{
    margin:12px 0 0;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .progress{ font-size:12px; color:var(--muted); letter-spacing:.02em; }
  .progress b{ color:var(--accent); }
  .restart{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:10px; padding:7px 13px; font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .restart:hover{ background:#F4EEDF; }

  .foot{
    margin:10px 0 0;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer;
    font-family:inherit; font-weight:600;
  }
  .chip.on{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft); }
  .foot-note{ font-size:11px; color:var(--muted); letter-spacing:.02em; }

  /* ---------- 练习日历 ---------- */
  .cal-overlay{
    position:fixed; inset:0; z-index:30;
    display:none; align-items:center; justify-content:center;
    padding:18px; background:rgba(43,37,25,.46);
  }
  .cal-overlay.show{ display:flex; }
  .cal-modal{
    width:min(100%,420px); max-height:92vh; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:14px 14px 12px; box-shadow:0 20px 60px rgba(40,30,10,.28);
    text-align:left;
  }
  .cal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .cal-head h2{ margin:0; font-size:17px; color:var(--accent); letter-spacing:.3px; }
  .cal-head p{ margin:3px 0 0; font-size:11px; color:var(--muted); line-height:1.45; }
  .cal-x{
    border:none; background:transparent; color:var(--muted);
    font-size:22px; line-height:1; cursor:pointer; padding:2px 6px; border-radius:8px;
  }
  .cal-x:hover{ background:var(--accent-soft); }

  .cal-nav{ display:flex; align-items:center; gap:6px; margin:10px 0 9px; }
  .cal-nav button{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:8px; font-family:inherit; cursor:pointer;
  }
  .cal-nav button:hover{ background:var(--accent-soft); color:var(--accent); }
  .cal-prev,.cal-next{ width:30px; height:30px; font-size:18px; line-height:1; padding:0; }
  .cal-month{ flex:1; text-align:center; font-size:14px; font-weight:700; color:var(--accent); }
  .cal-today{
    height:30px; padding:0 9px; font-size:11.5px; font-weight:700;
    color:var(--accent); border-color:var(--accent-line)!important;
    background:var(--accent-soft)!important;
  }

  .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
  .cal-week span{ text-align:center; font-size:10px; color:var(--muted); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-day{
    min-width:0; min-height:48px; padding:4px 2px 3px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    border:1px solid var(--line); border-radius:9px;
    background:var(--panel); color:var(--ink);
    font-family:inherit; cursor:default; position:relative;
  }
  .cal-day.blank{ background:transparent; border-color:transparent; }
  .cal-day .num{
    font-size:12px; line-height:1.2; font-variant-numeric:tabular-nums; font-weight:600;
  }
  .cal-day .cnt{
    margin-top:2px; font-size:9px; line-height:1.2; color:#fff;
    background:var(--accent); border-radius:999px; padding:0 5px; min-width:18px;
    text-align:center; opacity:0;
  }
  .cal-day.did .cnt{ opacity:1; }
  .cal-day.did{ background:var(--accent-soft); border-color:var(--accent-line); }
  .cal-day.today{ border-color:var(--accent); border-width:1.5px; }
  .cal-day.future{ color:#C6BFB2; }

  .cal-sum{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--line);
  }
  .cal-sum div{
    padding:8px 10px; border-radius:10px; background:#FBF7EE; border:1px solid var(--line);
    display:flex; flex-direction:column; gap:2px;
  }
  .cal-sum span{ font-size:10px; color:var(--muted); }
  .cal-sum b{ font-size:14px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }

  @media (max-width:420px){
    .cal-modal{ border-radius:16px; padding:12px 10px 10px; }
    .cal-day{ min-height:44px; }
  }

  @media (max-width:420px){
    body{ padding:10px 9px 18px; }
    h1{ font-size:17px; }
    .tile{ min-height:44px; padding:5px 9px; }
    .board{ gap:7px 16px; }
    .col{ gap:7px; }
    .mode{ padding:6px 11px; font-size:12px; }
    .example{ margin-top:10px; }
    .bar{ margin-top:10px; }
  }
</style>
</head>
<body data-mode="all">
<div class="wrap">

  <header>
    <h1>汉字拼音配对 <span>共 <b id="poolCount">0</b> 条 · <b id="charCount">0</b> 个汉字</span></h1>
    <button class="cal-btn" id="calBtn" type="button" aria-label="练习日历" title="练习日历">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"></rect>
        <path d="M7 3v4M17 3v4M3 10h18"></path>
        <path d="M8 14h2M14 14h2M8 18h2M14 18h2"></path>
      </svg>
    </button>
    <div class="modes" id="modes">
      <button class="mode on" data-mode="all" type="button">全部</button>
      <button class="mode" data-mode="w" type="button">词语</button>
      <button class="mode" data-mode="s" type="button">单字</button>
      <button class="mode" data-mode="p" type="button">地名</button>
    </div>
    <div class="stats">
      <div>得分<b id="score">0</b></div>
      <div>连击<b id="combo">0</b></div>
      <div>正确率<b id="acc">—</b></div>
    </div>
  </header>

  <div class="hint" id="hint">点左边的汉字，再点右边对应的拼音。标「地名」的是容易读错的地名。</div>

  <div class="board" id="board">
    <svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="col" id="colL"></div>
    <div class="col" id="colR"></div>
  </div>

  <div class="example" id="example">
    <div class="ex-main">
      <div class="ex-word empty" id="exWord">配对成功后会显示读音说明</div>
      <div class="ex-text" id="exText"></div>
    </div>
    <button class="ex-say" id="exSay" type="button" hidden>🔊 朗读</button>
  </div>

  <div class="bar">
    <div class="progress">本组 <b id="matchedN">0</b> / <span id="totalN">6</span> · 第 <b id="roundN">1</b> 组</div>
    <button class="restart" id="btnRestart" type="button">重新开始</button>
  </div>

  <div class="foot">
    <button class="chip on" id="ttsToggle" type="button">🔊 发音开</button>
    <span class="foot-note">配对成功会读一遍 · 手机会用系统语音</span>
  </div>

</div>

<div class="cal-overlay" id="calOverlay">
  <div class="cal-modal" role="dialog" aria-modal="true" aria-labelledby="calTitle">
    <div class="cal-head">
      <div>
        <h2 id="calTitle">练习日历</h2>
        <p>格子里的小数字是当天配对成功的数量</p>
      </div>
      <button class="cal-x" id="calClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="cal-nav">
      <button class="cal-prev" id="calPrev" type="button" aria-label="上个月">‹</button>
      <div class="cal-month" id="calMonth"></div>
      <button class="cal-next" id="calNext" type="button" aria-label="下个月">›</button>
      <button class="cal-today" id="calToday" type="button">今天</button>
    </div>
    <div class="cal-week">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-sum">
      <div><span>今日</span><b id="calTodayN">0</b></div>
      <div><span>本月</span><b id="calMonthN">0</b></div>
      <div><span>连续</span><b id="calStreak">0 天</b></div>
    </div>
  </div>
</div>

<script>

    "砀山":"安徽砀山，「砀」读 dàng，砀山梨的产地。",
    "弋阳":"江西弋阳，「弋」读 yì，不读 gē。弋阳腔的发源地。",
    "于都":"江西于都，「都」在这里读 dū，不读 dōu。",
    "长乐":"福建长乐，「乐」在这里读 lè，不读 yuè。",
    "建瓯":"福建建瓯，「瓯」读 ōu。",
    "衢州":"浙江衢州，「衢」读 qú。",
    "嵊州":"浙江嵊州，「嵊」读 shèng。",
    "鄞州":"浙江宁波鄞州，「鄞」读 yín。",
    "甪直":"江苏苏州甪直古镇，「甪」读 lù，不读 yòng。",
    "溧阳":"江苏溧阳，「溧」读 lì。",
    "耒阳":"湖南耒阳，「耒」读 lěi。",
    "郴州":"湖南郴州，「郴」读 chēn。"
  };

  var CFG = {
    PAIRS: 6,
    SCORE_HIT: 10,
    COMBO_BONUS: 5,
    REFILL_DELAY: 600
  };

  var TONE_MAP = {
    'ā':1,'ē':1,'ī':1,'ō':1,'ū':1,'ǖ':1,
    'á':2,'é':2,'í':2,'ó':2,'ú':2,'ǘ':2,
    'ǎ':3,'ě':3,'ǐ':3,'ǒ':3,'ǔ':3,'ǚ':3,
    'à':4,'è':4,'ì':4,'ò':4,'ù':4,'ǜ':4
  };
  var TONE_NAME = { 1:'一声', 2:'二声', 3:'三声', 4:'四声', 0:'轻声' };

  function $(id){ return document.getElementById(id); }
  var elScore=$('score'), elCombo=$('combo'), elAcc=$('acc');
  var elL=$('colL'), elR=$('colR'), elTip=$('hint'), elBoard=$('board');
  var elLines=$('lines'), elMatched=$('matchedN'), elTotal=$('totalN'), elRound=$('roundN');
  var elPool=$('poolCount'), elChars=$('charCount');
  var elExWord=$('exWord'), elExText=$('exText'), elExSay=$('exSay');
  var elCalOverlay=$('calOverlay'), elCalGrid=$('calGrid'), elCalMonth=$('calMonth');
  var elCalTodayN=$('calTodayN'), elCalMonthN=$('calMonthN'), elCalStreak=$('calStreak');

  var G = {
    score:0, combo:0, bestCombo:0, round:1,
    hits:0, misses:0,
    remaining:0, sel:null, locked:false,
    items:[], mode:'all', lastWord:''
  };

  var TTS = { on:true };

  /* ---------- 练习记录（按天累计配对成功数） ---------- */
  var STORE_KEY = 'hanzi_match.days.v1';
  var DAYS = {};

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }
  function keyOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

  function loadDays(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      for (var k in o){
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && typeof o[k] === 'number' && o[k] > 0) DAYS[k] = o[k];
      }
    } catch(e){ DAYS = {}; }
  }

  function saveDays(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(DAYS)); } catch(e){}
  }

  function recordMatch(){
    var k = keyOf(new Date());
    DAYS[k] = (DAYS[k] || 0) + 1;
    saveDays();
  }

  function poolFor(mode){
    if (mode === 'all') return WORDS;
    var out = [];
    for (var i=0;i<WORDS.length;i++){
      var t = WORDS[i][2];
      if (t === mode || (mode === 'w' && t === 'd')) out.push(WORDS[i]);
    }
    return out;
  }

  function refreshPoolCount(){
    elPool.textContent = String(poolFor(G.mode).length);
  }

  // 词条里一共出现多少个不同的汉字
  (function countChars(){
    var set = {}, n = 0;
    for (var i=0;i<WORDS.length;i++){
      var w = WORDS[i][0];
      for (var j=0;j<w.length;j++){
        var c = w.charAt(j);
        if (/[一-龥]/.test(c) && !set[c]){ set[c] = 1; n++; }
      }
    }
    elChars.textContent = String(n);
  })();

  function shuffle(a){
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  /* ---------- 抽题 ---------- */
  function pickItems(mode, count){
    var pool = poolFor(mode);
    // 类型权重只在「全部」模式生效：地名稀有，多给几次机会
    var weighted = [], weights = { w:1, s:0.6, p:5, d:2 };
    for (var i=0;i<pool.length;i++){
      weighted.push({ it:pool[i], w: mode === 'all' ? (weights[pool[i][2]] || 1) : 1 });
    }
    var picked = [], used = {}, guard = 0;
    while (picked.length < count && guard++ < 800 && weighted.length){
      var total = 0, k;
      for (k=0;k<weighted.length;k++) total += weighted[k].w;
      var r = Math.random() * total, idx = 0;
      for (k=0;k<weighted.length;k++){ r -= weighted[k].w; if (r <= 0){ idx = k; break; } }
      var item = weighted[idx].it;
      weighted.splice(idx, 1);
      if (used[item[0]]) continue;
      used[item[0]] = 1;
      picked.push(item);
    }
    return picked;
  }

  function newRound(keepScores){
    if (!keepScores){
      G.score = 0; G.combo = 0; G.hits = 0; G.misses = 0; G.round = 1;
    } else {
      G.round++;
    }
    var picked = pickItems(G.mode, CFG.PAIRS);
    G.items = picked.map(function(it, i){
      return { id:i, w:it[0], p:it[1], t:it[2], note:NOTES[it[0]] || '' };
    });
    G.remaining = G.items.length;
    G.sel = null;
    G.locked = false;
    elLines.innerHTML = '';
    render();
    renderHud();
    elTip.innerHTML = hintFor(G.mode);
    elExWord.className = 'ex-word empty';
    elExWord.textContent = '配对成功后会显示读音说明';
    elExText.textContent = '';
    elExSay.hidden = true;
  }

  function hintFor(mode){
    if (mode === 's') return '这一轮只出单字。先在心里读一遍，再找拼音。';
    if (mode === 'p') return '这一轮只出地名，都是容易读错的。';
    if (mode === 'w') return '这一轮只出常用词。点左边的词，再点右边对应的拼音。';
    return '点左边的汉字，再点右边对应的拼音。标「地名」的是容易读错的地名。';
  }

  /* ---------- 渲染 ---------- */
  function render(){
    elL.innerHTML = ''; elR.innerHTML = '';
    var left = G.items.slice();
    var right = shuffle(G.items.slice());
    for (var i=0;i<left.length;i++) elL.appendChild(makeTile(left[i], 'L'));
    for (var j=0;j<right.length;j++) elR.appendChild(makeTile(right[j], 'R'));
  }

  function makeTile(item, side){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile ' + (side === 'L' ? 'zh' : 'py');
    b.setAttribute('data-id', item.id);

    var s = document.createElement('span');
    s.className = 'word';
    s.textContent = side === 'L' ? item.w : item.p;
    b.appendChild(s);

    // 只在「全部」模式标类型；单一模式的按钮已经说明了一切
    if (G.mode === 'all' && (item.t === 'p' || item.t === 's' || item.t === 'd')){
      var tg = document.createElement('span');
      tg.className = 'tag ' + item.t;
      tg.textContent = item.t === 'p' ? '地名' : (item.t === 'd' ? '多音' : '单字');
      b.appendChild(tg);
    }

    b.addEventListener('click', function(){ onPick(b, item.id); });
    return b;
  }

  function renderHud(){
    elScore.textContent = String(G.score);
    elCombo.textContent = String(G.combo);
    var total = G.hits + G.misses;
    elAcc.textContent = total ? Math.round(G.hits / total * 100) + '%' : '—';
    elMatched.textContent = String(G.items.length - G.remaining);
    elTotal.textContent = String(G.items.length);
    elRound.textContent = String(G.round);
  }

  /* ---------- 交互 ---------- */
  function onPick(el, id){
    if (G.locked) return;
    if (el.classList.contains('matched')) return;

    if (G.sel && G.sel.el === el){
      el.classList.remove('sel');
      G.sel = null;
      return;
    }
    if (!G.sel){
      el.classList.add('sel');
      G.sel = { id:id, el:el };
      return;
    }
    var a = G.sel;
    if (a.el.parentNode === el.parentNode){
      a.el.classList.remove('sel');
      el.classList.add('sel');
      G.sel = { id:id, el:el };
      return;
    }
    var b = { id:id, el:el };
    if (a.id === b.id) doMatch(a, b);
    else doMiss(a, b);
  }

  function doMatch(a, b){
    G.locked = true;
    G.combo++;
    G.hits++;
    if (G.combo > G.bestCombo) G.bestCombo = G.combo;
    var gain = CFG.SCORE_HIT + (G.combo % 5 === 0 ? CFG.COMBO_BONUS : 0);
    G.score += gain;
    G.remaining--;

    var L = a.el.classList.contains('zh') ? a.el : b.el;
    var R = a.el.classList.contains('zh') ? b.el : a.el;

    a.el.classList.remove('sel');
    b.el.classList.remove('sel');
    a.el.classList.add('ok');
    b.el.classList.add('ok');
    G.sel = null;

    drawLink(L, R);

    var item = G.items[a.id];
    G.lastWord = item.w;
    recordMatch();
    showExample(item);
    speak(item.w);
    elTip.innerHTML = '<b>+' + gain + '</b>　' + esc(item.w);
    renderHud();

    setTimeout(function(){
      a.el.classList.add('matched');
      b.el.classList.add('matched');
      G.locked = false;
      if (G.remaining <= 0){
        elTip.innerHTML = '<span class="gold">这一组完成了，自动换下一组</span>';
        setTimeout(function(){ newRound(true); }, CFG.REFILL_DELAY);
      }
    }, 280);
  }

  function doMiss(a, b){
    G.combo = 0;
    G.misses++;
    renderHud();
    a.el.classList.remove('sel');
    b.el.classList.add('bad');
    elTip.innerHTML = '<span class="warn">不对，再看一眼</span>';
    setTimeout(function(){
      a.el.classList.remove('sel');
      b.el.classList.remove('bad');
      G.sel = null;
    }, 540);
  }

  /* ---------- 信息面板 ---------- */
  function showExample(item){
    elExWord.className = 'ex-word';
    elExWord.innerHTML = esc(item.w) + '<span class="py">' + esc(item.p) + '</span>';

    if (item.note){
      elExText.textContent = item.note;
    } else if (item.t === 's'){
      var g = MEANING[item.w];
      elExText.textContent = g ? ('字义：' + g) : ('单字　' + tonesOf(item.p) + '。');
    } else if (item.t === 'd'){
      elExText.textContent = '多音字词　' + tonesOf(item.p) + '。';
    } else {
      elExText.textContent = '常用词　' + tonesOf(item.p) + '。';
    }
    elExSay.hidden = !('speechSynthesis' in window);
  }

  function tonesOf(py){
    var parts = py.split(' ');
    var out = [];
    for (var i=0;i<parts.length;i++){
      var t = 0, s = parts[i];
      for (var j=0;j<s.length;j++){ if (TONE_MAP[s[j]]){ t = TONE_MAP[s[j]]; break; } }
      out.push(TONE_NAME[t]);
    }
    return out.join(' + ');
  }

  /* ---------- 连线 ---------- */
  var NS = 'http://www.w3.org/2000/svg';

  function drawLink(elL2, elR2){
    var br = elBoard.getBoundingClientRect();
    var a = elL2.getBoundingClientRect();
    var b = elR2.getBoundingClientRect();
    var x1 = a.left + a.width  / 2 - br.left;
    var y1 = a.top  + a.height / 2 - br.top;
    var x2 = b.left + b.width  / 2 - br.left;
    var y2 = b.top  + b.height / 2 - br.top;
    var dx = Math.max(20, Math.abs(x2 - x1) * 0.42);

    var d = 'M' + x1 + ' ' + y1 +
            ' C' + (x1 + dx) + ' ' + y1 + ', ' +
                    (x2 - dx) + ' ' + y2 + ', ' +
                    x2 + ' ' + y2;

    var g = document.createElementNS(NS, 'g');

    var halo = document.createElementNS(NS, 'path');
    halo.setAttribute('class', 'link-halo');
    halo.setAttribute('d', d);
    halo.setAttribute('pathLength', '100');
    g.appendChild(halo);

    var p = document.createElementNS(NS, 'path');
    p.setAttribute('class', 'link');
    p.setAttribute('d', d);
    p.setAttribute('pathLength', '100');
    g.appendChild(p);

    [[x1, y1], [x2, y2]].forEach(function(pt){
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('class', 'link-dot');
      c.setAttribute('cx', pt[0]);
      c.setAttribute('cy', pt[1]);
      c.setAttribute('r', 3.2);
      g.appendChild(c);
    });

    elLines.appendChild(g);

    // 同一元素上有绘制和淡出两个动画，必须按名字区分
    p.addEventListener('animationend', function(ev){
      if (ev.animationName === 'fadeOut' && g.parentNode) g.parentNode.removeChild(g);
    });
  }

  /* ---------- 朗读 ---------- */
  function speak(text){
    if (!TTS.on || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = 0.85;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch(e){ /* 系统没有中文语音时静默跳过 */ }
  }

  /* ---------- 工具 ---------- */
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  /* ---------- 事件 ---------- */
  $('modes').addEventListener('click', function(e){
    var btn = e.target.closest('.mode');
    if (!btn) return;
    var m = btn.getAttribute('data-mode');
    if (m === G.mode) return;
    G.mode = m;
    document.body.setAttribute('data-mode', m);
    var all = this.querySelectorAll('.mode');
    for (var i=0;i<all.length;i++) all[i].classList.toggle('on', all[i] === btn);
    refreshPoolCount();
    newRound(false);
  });

  $('btnRestart').addEventListener('click', function(){ newRound(false); });

  $('ttsToggle').addEventListener('click', function(){
    TTS.on = !TTS.on;
    this.textContent = TTS.on ? '🔊 发音开' : '🔇 发音关';
    this.classList.toggle('on', TTS.on);
    if (!TTS.on && 'speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  });

  elExSay.addEventListener('click', function(){
    var on = TTS.on; TTS.on = true; speak(G.lastWord); TTS.on = on;
  });

  // 只有宽度明显变化才丢弃连线（手机地址栏收起这类小抖动不算）
  var lastW = window.innerWidth;
  window.addEventListener('resize', function(){
    if (Math.abs(window.innerWidth - lastW) > 40){
      elLines.innerHTML = '';
      lastW = window.innerWidth;
    }
  });

  /* ---------- 日历 ---------- */
  var calCursor = new Date();

  function streakDays(){
    var n = 0, d = new Date();
    if (!DAYS[keyOf(d)]) d.setDate(d.getDate() - 1);
    while (DAYS[keyOf(d)]){ n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function renderCal(){
    var y = calCursor.getFullYear(), m = calCursor.getMonth();
    elCalMonth.textContent = y + ' 年 ' + (m + 1) + ' 月';

    var start = new Date(y, m, 1).getDay();
    var days = new Date(y, m + 1, 0).getDate();
    var today = new Date();
    var todayKey = keyOf(today);
    var todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();

    var html = '';
    for (var i = 0; i < start; i++) html += '<div class="cal-day blank"></div>';
    for (var d = 1; d <= days; d++){
      var k = y + '-' + pad2(m + 1) + '-' + pad2(d);
      var n = DAYS[k] || 0;
      var cls = 'cal-day';
      if (n) cls += ' did';
      if (k === todayKey) cls += ' today';
      if (new Date(y, m, d).getTime() > todayMid) cls += ' future';
      html += '<div class="' + cls + '"><div class="num">' + d +
              '</div><div class="cnt">' + n + '</div></div>';
    }
    elCalGrid.innerHTML = html;

    var monthSum = 0;
    for (var dd = 1; dd <= days; dd++) monthSum += DAYS[y + '-' + pad2(m + 1) + '-' + pad2(dd)] || 0;

    elCalTodayN.textContent = String(DAYS[todayKey] || 0);
    elCalMonthN.textContent = String(monthSum);
    elCalStreak.textContent = streakDays() + ' 天';
  }

  function openCal(){
    calCursor = new Date();
    renderCal();
    elCalOverlay.classList.add('show');
  }
  function closeCal(){ elCalOverlay.classList.remove('show'); }

  $('calBtn').addEventListener('click', openCal);
  $('calClose').addEventListener('click', closeCal);
  elCalOverlay.addEventListener('click', function(e){ if (e.target === elCalOverlay) closeCal(); });
  $('calPrev').addEventListener('click', function(){
    calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() - 1, 1); renderCal();
  });
  $('calNext').addEventListener('click', function(){
    calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 1); renderCal();
  });
  $('calToday').addEventListener('click', function(){ calCursor = new Date(); renderCal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeCal(); });

  loadDays();
  refreshPoolCount();
  newRound(false);
})();
</script>
</body>
</html>
