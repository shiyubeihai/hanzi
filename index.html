<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>汉字8105</title>
<style>
  :root{
    --bg:#f4f1ea;
    --card:#fffdf8;
    --ink:#2e2a24;
    --ink-soft:#8a8177;
    --green:#2f6b4f;
    --gold:#b8852b;
    --line:#e6dfd3;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex; justify-content:center;
    padding:max(28px, env(safe-area-inset-top)) 20px 40px;
  }
  .wrap{ width:100%; max-width:480px; }

  header{ margin-bottom:32px; }
  h1{
    font-family:"Songti SC","SimSun","STSong",serif;
    font-size:34px; font-weight:700; letter-spacing:.2em;
    color:var(--ink);
    display:flex; align-items:baseline; gap:.1em;
  }
  h1 .num{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:.6em; font-weight:700;
    letter-spacing:.02em;
    color:var(--gold);
  }
  .sub{
    font-size:11.5px; letter-spacing:.3em;
    color:var(--ink-soft); margin-top:9px;
  }
  .origin{
    font-size:11px; line-height:1.7;
    color:#b3aa9c; letter-spacing:.03em;
    margin-top:12px;
  }
  .origin b{ color:#9a8f7e; font-weight:600; letter-spacing:.02em; }
  .rule{
    height:1px; background:var(--line);
    margin-top:22px;
  }

  main{ display:flex; flex-direction:column; gap:14px; }

  .card{
    display:block; position:relative;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:18px;
    padding:20px 20px 18px;
    text-decoration:none; color:inherit;
    box-shadow:0 2px 8px rgba(120,108,92,.06);
    transition:transform .12s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .card:hover{ border-color:#cfbfa2; box-shadow:0 6px 18px rgba(120,108,92,.11); }
  .card:active{ transform:scale(.985); }

  .card-title{
    font-size:19px; font-weight:700; letter-spacing:.06em;
    color:var(--ink);
  }
  .card-desc{
    font-size:12.5px; line-height:1.75;
    color:var(--ink-soft); margin-top:7px;
  }
  .card-tags{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;
  }
  .tag{
    font-size:10.5px; letter-spacing:.06em;
    color:#9a8f7e; background:#f6f2ea;
    border-radius:6px; padding:2.5px 8px;
  }
  .card-go{
    position:absolute; right:20px; top:20px;
    font-size:12px; color:var(--gold); letter-spacing:.1em;
  }

  footer{
    margin-top:36px;
    font-size:11px; line-height:1.9;
    color:#bdb4a7; letter-spacing:.05em;
  }

  .empty{
    border:1.5px dashed var(--line);
    border-radius:18px;
    padding:26px 20px;
    text-align:center;
    font-size:12.5px; color:#c0b7a9;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>汉字<span class="num">8105</span></h1>
    <div class="sub">认字 · 拆字 · 写字</div>
    <div class="origin">
      <b>8105</b> 是《通用规范汉字表》的收字总数：一级 3500 · 二级 3000 · 三级 1605。<br>
      该表由国务院于 2013 年发布，是现行汉字使用规范。
    </div>
    <div class="rule"></div>
  </header>

  <main>
    <!-- 汉字拼音配对固定置顶，新游戏一律加在它下面 -->
    <a class="card" href="./hanzi_match/">
      <div class="card-go">进入 →</div>
      <div class="card-title">汉字拼音配对</div>
      <div class="card-desc">左边出字词，右边出拼音，点两边配对，配对成功会牵一条线，并显示读音说明。分全部 / 词语 / 单字 / 地名四种模式，单字卡带字典释义。</div>
      <div class="card-tags">
        <span class="tag">2264 条</span>
        <span class="tag">1504 个汉字</span>
        <span class="tag">带调号</span>
      </div>
    </a>

    <a class="card" href="./wubi_typing/">
      <div class="card-go">进入 →</div>
      <div class="card-title">五笔消消乐</div>
      <div class="card-desc">屏幕上出三个字，按出它们的五笔编码就能消掉。边打字边复习字根口诀。</div>
      <div class="card-tags">
        <span class="tag">630 字</span>
        <span class="tag">一级 · 二级简码</span>
        <span class="tag">手机可用</span>
      </div>
    </a>

    <div class="empty">还有位置，继续加</div>
  </main>

  <footer>
    纯前端，无需安装。进度与设置存在本机浏览器。
  </footer>
</div>
</body>
</html>
